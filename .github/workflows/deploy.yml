# Bouwt en publiceert de tool naar GitHub Pages bij elke push naar main.
# Lint en de tests draaien eerst: een kapotte versie komt nooit live.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies installeren
        run: npm ci
      - name: Lint (een fout = geen deploy)
        run: npm run lint
      - name: Tests draaien (falen = geen deploy)
        run: npm test
      - name: Bouwen
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
