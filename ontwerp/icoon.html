<!DOCTYPE html>
<!--
  Het app-icoon: het kaartje van ShutterBox op warm zwart (DESIGN.md), zonder
  tekst, zodat het ook op 16 pixels leesbaar blijft. public/favicon.svg is de
  variant "rond".

  Varianten, via ?v=...&s=<pixels>:
    rond    afgeronde hoek, doorzichtige hoeken (icon-192, icon-512)
    vol     vol vierkant; iOS rondt zelf af (apple-touch-icon, 180)
    veilig  vol vierkant, kaartje kleiner binnen de veilige cirkel van
            Android (icon-maskable-512)

  Opnieuw maken met Chrome. Geef bij --screenshot een volledig pad, anders
  zet Chrome het plaatje in zijn eigen map:
    chrome --headless=new --hide-scrollbars --default-background-color=00000000
      --window-size=192,192 --screenshot=<repo>/public/icon-192.png
      "file:///<repo>/ontwerp/icoon.html?v=rond&s=192"
  en zo ook 512 (rond), 180 (vol, apple-touch-icon.png) en 512 (veilig,
  icon-maskable-512.png).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="icoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect id="achter" width="64" height="64" rx="14" fill="#121110"/>
  <g id="kaartje">
    <rect x="7" y="18" width="50" height="28" rx="2" fill="#ece6dc"/>
    <path d="M43 18h12a2 2 0 0 1 2 2v24a2 2 0 0 1-2 2H43z" fill="#8a3530"/>
    <rect x="11" y="22" width="28" height="1.8" fill="#1b1a18"/>
    <rect x="11" y="26.5" width="26" height="4.5" fill="#1b1a18"/>
    <rect x="11" y="33.5" width="18" height="2" fill="#1b1a18"/>
    <rect x="11" y="39" width="8" height="2" fill="#1b1a18" opacity="0.55"/>
    <rect x="22" y="39" width="8" height="2" fill="#1b1a18" opacity="0.55"/>
    <circle cx="43" cy="18" r="3.4" fill="#121110"/>
    <circle cx="43" cy="46" r="3.4" fill="#121110"/>
  </g>
</svg>
<script>
  const p = new URLSearchParams(location.search);
  const v = p.get('v') || 'rond';
  const s = Number(p.get('s')) || 64;
  const svg = document.getElementById('icoon');
  svg.setAttribute('width', s);
  svg.setAttribute('height', s);
  if (v !== 'rond') document.getElementById('achter').setAttribute('rx', '0');
  if (v === 'veilig') document.getElementById('kaartje').setAttribute('transform', 'translate(32 32) scale(0.84) translate(-32 -32)');
</script>
</body>
</html>
